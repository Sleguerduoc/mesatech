spring.application.name=bff
# EC2 A. Puerto publicado hacia AWS API Gateway (integracion HTTP de la EP1).
server.port=${SERVER_PORT:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/5a675e5a-f448-4fbb-a038-0338ac004c33/v2.0}

# aud: client id de la app mesatech-api (token v2). Solo se aceptan tokens emitidos para esta API.
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:2f873d12-ff50-4b45-8e2f-81a044d7b15f}

# ms-catalogo corre en la misma EC2 A; ms-solicitudes en la EC2 B (IP privada)
ms.catalogo.url=${MS_CATALOGO_URL:http://127.0.0.1:8082}
ms.solicitudes.url=${MS_SOLICITUDES_URL}
