spring.application.name=ms-solicitudes

# EC2 B. Escucha en la IP privada: el security group solo permite el puerto desde la EC2 del BFF.
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

# RDS exclusivo de Solicitudes (mesatech-rds-solicitudes). Valores reales en /etc/mesatech/ms-solicitudes.env
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mesatech_solicitudes}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# none: las tablas se crean con infra/sql y el usuario de aplicacion no tiene permisos DDL
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false

# RabbitMQ en EC2 C (IP privada). Usuario de aplicacion con permiso solo de lectura sobre la cola.
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Un mensaje a la vez
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
# AUTO: el contenedor envia el ack solo cuando el listener retorna sin excepcion (despues de guardar en RDS)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# Si falla el guardado el mensaje se devuelve a la cola (no se pierde)
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# Si la cola no existe al arrancar, no detener la aplicacion (sigue reintentando)
spring.rabbitmq.listener.simple.missing-queues-fatal=false

app.rabbitmq.queue=${RABBITMQ_QUEUE:solicitudes.catalogo.queue}
