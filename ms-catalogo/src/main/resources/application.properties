spring.application.name=ms-catalogo

# EC2 A. Escucha solo en localhost porque el BFF corre en la misma instancia.
server.port=${SERVER_PORT:8082}
server.address=${SERVER_ADDRESS:127.0.0.1}

# RDS exclusivo de Catalogo (mesatech-rds-catalogo). Valores reales en /etc/mesatech/ms-catalogo.env
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mesatech_catalogo}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# none: las tablas se crean con infra/sql y el usuario de aplicacion no tiene permisos DDL
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false

# RabbitMQ en EC2 C (IP privada). Usuario de aplicacion con permiso solo de escritura en el exchange.
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones del broker (ack/nack) y retorno de mensajes sin ruta a una cola
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados previamente en el virtual host mesatech
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:catalogo.exchange}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:categoria.creada}
app.rabbitmq.confirm-timeout-segundos=10
